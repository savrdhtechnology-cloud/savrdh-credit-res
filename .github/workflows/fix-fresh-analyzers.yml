name: Fix fresh analyzer sessions

on:
  push:
    paths:
      - '.github/workflows/fix-fresh-analyzers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch analyzers
        shell: python
        run: |
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text()
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Expected text not found in {path}: {old[:100]}')
                  s = s.replace(old, new, 1)
              p.write_text(s)

          patch('src/components/tools/CibilReportAnalyzer.tsx', [
            ('const [report, setReport] = useState<CreditBureauReport>(initialReport || SAMPLE_CIBIL_REPORTS[0].report);',
             'const [report, setReport] = useState<CreditBureauReport>(initialReport || DEFAULT_CREDIT_REPORT);'),
            ('const [activeSampleId, setActiveSampleId] = useState<string>("sample-balram");',
             'const [activeSampleId, setActiveSampleId] = useState<string>(initialReport ? "initial-report" : "");'),
            ('const [inputMode, setInputMode] = useState<"DEMO" | "UPLOAD" | "PASTE">("DEMO");',
             'const [inputMode, setInputMode] = useState<"DEMO" | "UPLOAD" | "PASTE">("UPLOAD");'),
            ('const [successMsg, setSuccessMsg] = useState("");',
             'const [successMsg, setSuccessMsg] = useState("");\n  const [hasAnalysis, setHasAnalysis] = useState(Boolean(initialReport));'),
            ('setReport(s.report);\n      setSuccessMsg(`Loaded sample report: ${s.name}`);',
             'setReport(s.report);\n      setHasAnalysis(true);\n      setSuccessMsg(`Loaded sample report: ${s.name}`);'),
            ('setUploadedFile({\n        name: file.name,',
             'setHasAnalysis(false);\n      setActiveSampleId("");\n      setUploadedFile({\n        name: file.name,'),
            ('setReport(res.report);\n        setActiveSampleId("custom-upload");',
             'setReport(res.report);\n        setHasAnalysis(true);\n        setActiveSampleId("custom-upload");'),
            ('customerName: report.verifiedProfile?.matchedName || "Customer",\n        panNumber: report.verifiedProfile?.matchedPan || "ABCDE1234F",',
             'customerName: hasAnalysis ? (report.verifiedProfile?.matchedName || "Customer") : "Customer",\n        panNumber: hasAnalysis ? (report.verifiedProfile?.matchedPan || "") : "",'),
            ('      {/* 1. LIVE CIBIL SCORE & IDENTITY HEADER */}',
             '      {!hasAnalysis && !isAnalyzing && (\n        <div className="p-8 rounded-2xl bg-navy-950 border border-slate-800 text-center space-y-2">\n          <FileText className="w-8 h-8 text-slate-500 mx-auto" />\n          <h3 className="text-sm font-bold text-slate-200">Start a New CIBIL Analysis</h3>\n          <p className="text-xs text-slate-400">Upload a new bureau PDF, paste report text, or explicitly choose a demo sample. No previous customer report is loaded.</p>\n        </div>\n      )}\n      {hasAnalysis && <>\n      {/* 1. LIVE CIBIL SCORE & IDENTITY HEADER */}'),
            ('      {/* Bottom Disclaimer */}',
             '      </>}\n      {/* Bottom Disclaimer */}'),
          ])

          patch('src/components/tools/LoanStatementAnalyzer.tsx', [
            ('const [statement, setStatement] = useState<LoanStatementAnalysis>(SAMPLE_LOAN_STATEMENTS[0]);',
             'const [statement, setStatement] = useState<LoanStatementAnalysis>(SAMPLE_LOAN_STATEMENTS[0]);'),
            ('const [activeSampleId, setActiveSampleId] = useState<string>("loan-sample-1");',
             'const [activeSampleId, setActiveSampleId] = useState<string>("");'),
            ('const [inputMode, setInputMode] = useState<"DEMO" | "UPLOAD" | "PASTE">("DEMO");',
             'const [inputMode, setInputMode] = useState<"DEMO" | "UPLOAD" | "PASTE">("UPLOAD");'),
            ('const [successMsg, setSuccessMsg] = useState("");',
             'const [successMsg, setSuccessMsg] = useState("");\n  const [hasAnalysis, setHasAnalysis] = useState(false);'),
            ('setStatement(s);\n      setSuccessMsg(`Loaded statement: ${s.lenderName} (${s.loanType})`);',
             'setStatement(s);\n      setHasAnalysis(true);\n      setSuccessMsg(`Loaded statement: ${s.lenderName} (${s.loanType})`);'),
            ('setUploadedFile({\n        name: file.name,',
             'setHasAnalysis(false);\n      setActiveSampleId("");\n      setUploadedFile({\n        name: file.name,'),
            ('setStatement(res.statement);\n        setActiveSampleId("custom-statement");',
             'setStatement(res.statement);\n        setHasAnalysis(true);\n        setActiveSampleId("custom-statement");'),
            ('      {/* 1. KEY LOAN SANCTION & REPAYMENT SUMMARY CARD */}',
             '      {!hasAnalysis && !isAnalyzing && (\n        <div className="p-8 rounded-2xl bg-navy-950 border border-slate-800 text-center space-y-2">\n          <FileText className="w-8 h-8 text-slate-500 mx-auto" />\n          <h3 className="text-sm font-bold text-slate-200">Start a New Loan Statement Audit</h3>\n          <p className="text-xs text-slate-400">Upload a new statement, paste statement text, or explicitly choose a demo sample. No previous loan data is loaded.</p>\n        </div>\n      )}\n      {hasAnalysis && <>\n      {/* 1. KEY LOAN SANCTION & REPAYMENT SUMMARY CARD */}'),
            ('      {/* Formal Dispute Notice Modal */}',
             '      </>}\n      {/* Formal Dispute Notice Modal */}'),
          ])
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit fix
        run: |
          git config user.name "savrdh-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/tools/CibilReportAnalyzer.tsx src/components/tools/LoanStatementAnalyzer.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: start CIBIL and loan analyzers with fresh sessions"
          git push
